name: Build SignalX APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --project-name signalx .

      - name: Inject Google Maps API Key
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</application>|    <meta-data android:name="com.google.android.geo.API_KEY" android:value="${{ secrets.MAPS_API_KEY }}"/>\n    </application>|' $MANIFEST

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (warnings only, no fail)
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signalx-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
